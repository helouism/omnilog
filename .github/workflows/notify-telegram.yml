name: Notify Telegram — New Blog Post

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts.ts'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Blog post slug to announce (e.g. nginx-access-log-format)'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Send Telegram notifications for new posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MANUAL_SLUG: ${{ inputs.slug }}
        run: |
          python3 << 'EOF'
          import json, os, re, subprocess, urllib.request, urllib.error

          with open('src/content/posts.ts') as f:
              current = f.read()

          manual_slug = os.environ.get('MANUAL_SLUG', '').strip()

          if manual_slug:
              # Manual trigger: announce a specific post by slug
              new_slugs = [manual_slug]
          else:
              # Push trigger: detect slugs added in this commit
              try:
                  prev = subprocess.check_output(
                      ['git', 'show', 'HEAD~1:src/content/posts.ts'],
                      text=True, stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  prev = ''

              def get_slugs(text):
                  return [m.group(1) for m in re.finditer(r"slug:\s*'([^']+)'", text)]

              prev_slugs = set(get_slugs(prev))
              new_slugs = [s for s in get_slugs(current) if s not in prev_slugs]

          if not new_slugs:
              print('No new posts detected.')
              raise SystemExit(0)

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          if not token:
              print('TELEGRAM_BOT_TOKEN is not set — skipping.')
              raise SystemExit(0)

          for slug in new_slugs:
              idx = current.find(f"'{slug}'")
              chunk = current[max(0, idx - 300):idx + 600]
              m = re.search(r"title:\s*'([^']+)'", chunk)
              title = m.group(1) if m else slug
              url = f'https://omnilog.my.id/blog/{slug}'
              text = f'{title}\n\n{url}'

              payload = json.dumps({
                  'chat_id': '@omnilogofficial',
                  'text': text,
              }).encode()

              req = urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  data=payload,
                  headers={'Content-Type': 'application/json'},
              )
              try:
                  result = json.loads(urllib.request.urlopen(req).read())
                  if result.get('ok'):
                      print(f'Sent: "{title}"')
                  else:
                      print(f'Telegram error for "{slug}": {result.get("description")}')
                      raise SystemExit(1)
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code} for "{slug}": {e.read().decode()}')
                  raise SystemExit(1)
          EOF
