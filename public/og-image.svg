  <!-- ── Background ── -->
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#21262d"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.55"/>

  <!-- ── Ambient glow blobs behind icon ── -->
  <ellipse cx="220" cy="270" rx="170" ry="170" fill="#7e14ff" opacity="0.22" filter="url(#blob)"/>
  <ellipse cx="240" cy="390" rx="90"  ry="90"  fill="#47bfff" opacity="0.12" filter="url(#blob)"/>

  <!-- ────────────────────────────────────────────────
       Favicon icon: original 48×46 → scaled 4.35×
       → renders as ~209×200 px
       Centered at (230, 315):
         translate_x = 230 − 104.4 = 125.6
         translate_y = 315 − 100.1 = 214.9
  ──────────────────────────────────────────────── -->
  <g transform="translate(125.6, 214.9) scale(4.35)">
    <!-- Base bolt (visible fill) -->
    <path fill="#863bff" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" style="fill:#863bff;fill:color(display-p3 .5252 .23 1);fill-opacity:1"/>
    <!-- Clip mask (same bolt shape, black) -->
    <mask id="ogm" width="48" height="46" x="0" y="0" maskUnits="userSpaceOnUse" style="mask-type:alpha">
      <path fill="#000" d="M25.842 44.938c-.664.844-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.183c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.498 0-3.579-1.842-3.579H1.133c-.92 0-1.456-1.04-.92-1.787L9.91.473c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.578 1.842 3.578h11.377c.943 0 1.473 1.088.89 1.832L25.843 44.94z" style="fill:#000;fill-opacity:1"/>
    </mask>
    <!-- Inner glow ellipses (masked to bolt shape) -->
    <g mask="url(#ogm)">
      <g filter="url(#fb)"><ellipse cx="5.508" cy="14.704" fill="#ede6ff" rx="5.508" ry="14.704" style="fill:#ede6ff;fill:color(display-p3 .9275 .9033 1);fill-opacity:1" transform="matrix(.00324 1 1 -.00324 -4.47 31.516)"/></g>
      <g filter="url(#fc)"><ellipse cx="10.399" cy="29.851" fill="#ede6ff" rx="10.399" ry="29.851" style="fill:#ede6ff;fill:color(display-p3 .9275 .9033 1);fill-opacity:1" transform="matrix(.00324 1 1 -.00324 -39.328 7.883)"/></g>
      <g filter="url(#fd)"><ellipse cx="5.508" cy="30.487" fill="#7e14ff" rx="5.508" ry="30.487" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.814 -25.913 -14.639)scale(1 -1)"/></g>
      <g filter="url(#fe)"><ellipse cx="5.508" cy="30.599" fill="#7e14ff" rx="5.508" ry="30.599" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.814 -32.644 -3.334)scale(1 -1)"/></g>
      <g filter="url(#ff)"><ellipse cx="5.508" cy="30.599" fill="#7e14ff" rx="5.508" ry="30.599" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="matrix(.00324 1 1 -.00324 -34.34 30.47)"/></g>
      <g filter="url(#fg)"><ellipse cx="14.072" cy="22.078" fill="#ede6ff" rx="14.072" ry="22.078" style="fill:#ede6ff;fill:color(display-p3 .9275 .9033 1);fill-opacity:1" transform="rotate(93.35 24.506 48.493)scale(-1 1)"/></g>
      <g filter="url(#fh)"><ellipse cx="3.47" cy="21.501" fill="#7e14ff" rx="3.47" ry="21.501" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.009 28.708 47.59)scale(-1 1)"/></g>
      <g filter="url(#fi)"><ellipse cx="3.47" cy="21.501" fill="#7e14ff" rx="3.47" ry="21.501" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(89.009 28.708 47.59)scale(-1 1)"/></g>
      <g filter="url(#fj)"><ellipse cx=".387" cy="8.972" fill="#7e14ff" rx="4.407" ry="29.108" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(39.51 .387 8.972)"/></g>
      <g filter="url(#fk)"><ellipse cx="47.523" cy="-6.092" fill="#7e14ff" rx="4.407" ry="29.108" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(37.892 47.523 -6.092)"/></g>
      <g filter="url(#fl)"><ellipse cx="41.412" cy="6.333" fill="#47bfff" rx="5.971" ry="9.665" style="fill:#47bfff;fill:color(display-p3 .2799 .748 1);fill-opacity:1" transform="rotate(37.892 41.412 6.333)"/></g>
      <g filter="url(#fm)"><ellipse cx="-1.879" cy="38.332" fill="#7e14ff" rx="4.407" ry="29.108" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(37.892 -1.88 38.332)"/></g>
      <g filter="url(#fn)"><ellipse cx="-1.879" cy="38.332" fill="#7e14ff" rx="4.407" ry="29.108" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(37.892 -1.88 38.332)"/></g>
      <g filter="url(#fo)"><ellipse cx="35.651" cy="29.907" fill="#7e14ff" rx="4.407" ry="29.108" style="fill:#7e14ff;fill:color(display-p3 .4922 .0767 1);fill-opacity:1" transform="rotate(37.892 35.651 29.907)"/></g>
      <g filter="url(#fp)"><ellipse cx="38.418" cy="32.4" fill="#47bfff" rx="5.971" ry="15.297" style="fill:#47bfff;fill:color(display-p3 .2799 .748 1);fill-opacity:1" transform="rotate(37.892 38.418 32.4)"/></g>
    </g>
  </g>

  <!-- ── Vertical divider ── -->
  <line x1="430" y1="120" x2="430" y2="510" stroke="#21262d" stroke-width="1"/>

  <!-- ── Text: brand name ── -->
  <text
    x="490" y="290"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="96" font-weight="800" fill="#e6edf3" letter-spacing="-3">OmniLog</text>

  <!-- ── Text: subtitle ── -->
  <text
    x="496" y="346"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="30" font-weight="400" fill="#8b949e" letter-spacing="3">Analytics Engine</text>

  <!-- ── Separator ── -->
  <line x1="490" y1="374" x2="1150" y2="374" stroke="#21262d" stroke-width="1.5"/>

  <!-- ── Tagline ── -->
  <text
    x="490" y="416"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="22" fill="#6e7681" letter-spacing="0.2">
    Privacy-first log analytics. 100% in your browser. Zero uploads.
  </text>

  <!-- ── Feature pills ── -->
  <!-- Zero Egress -->
  <rect x="490" y="446" width="162" height="40" rx="20" fill="#0f2318" stroke="#238636" stroke-width="1.5"/>
  <text x="571" y="471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="500" fill="#3fb950" text-anchor="middle">✦ Zero Egress</text>

  <!-- 100 GB+ Files -->
  <rect x="666" y="446" width="162" height="40" rx="20" fill="#0d1f38" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="747" y="471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="500" fill="#58a6ff" text-anchor="middle">✦ 100 GB+ Files</text>

  <!-- Works Offline -->
  <rect x="842" y="446" width="162" height="40" rx="20" fill="#160d2e" stroke="#6e40c9" stroke-width="1.5"/>
  <text x="923" y="471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="500" fill="#bc8cff" text-anchor="middle">✦ Works Offline</text>

  <!-- PWA -->
  <rect x="1018" y="446" width="110" height="40" rx="20" fill="#231a08" stroke="#9e6a03" stroke-width="1.5"/>
  <text x="1073" y="471" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="15" font-weight="500" fill="#e3b341" text-anchor="middle">✦ PWA</text>

  <!-- ── URL watermark ── -->
  <text
    x="1150" y="594"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="17" fill="#30363d" text-anchor="end">omnilog.my.id</text>

  <!-- ── Bottom accent bar ── -->
  <rect x="0" y="623" width="1200" height="4" fill="url(#accentLine)" rx="2"/>
</svg>
